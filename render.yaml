services:
  - type: web
    name: netguard-ai-backend
    env: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && python scripts/prepare_dataset.py && python backend/models/train.py"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: CORS_ORIGINS
        value: "*"
      - key: DB_PATH
        value: /tmp/netguard.db
